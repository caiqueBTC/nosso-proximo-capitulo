<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Ilustração romântica do casal Caique e Isabela">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3A0C1C" />
      <stop offset="58%" stop-color="#1F0711" />
      <stop offset="100%" stop-color="#12040A" />
    </radialGradient>
    <radialGradient id="candleHalo" cx="50%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#F3E3BD" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#B5122B" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#12040A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3BD" />
      <stop offset="50%" stop-color="#E0C48A" />
      <stop offset="100%" stop-color="#B8924A" />
    </linearGradient>
    <linearGradient id="crimsonHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7D" />
      <stop offset="45%" stop-color="#D7263D" />
      <stop offset="100%" stop-color="#7A0A1C" />
    </linearGradient>
  </defs>

  <!-- Fundo noite à luz de velas -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="260" r="250" fill="url(#candleHalo)" />

  <!-- Moldura interna de folha de ouro champanhe -->
  <rect x="26" y="26" width="548" height="548" rx="22" fill="none" stroke="url(#goldFoil)" stroke-width="1.6" stroke-opacity="0.48" />
  <rect x="38" y="38" width="524" height="524" rx="16" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Poeira dourada -->
  <g fill="#F3E3BD" opacity="0.75">
    <circle cx="110" cy="115" r="2.5" />
    <circle cx="485" cy="105" r="3" />
    <circle cx="150" cy="210" r="1.8" />
    <circle cx="460" cy="220" r="2.2" />
    <circle cx="95" cy="360" r="2" />
    <circle cx="505" cy="350" r="2.6" />
    <path d="M300 78 L304 90 L316 94 L304 98 L300 110 L296 98 L284 94 L296 90 Z" fill="url(#goldFoil)" />
  </g>

  <!-- Coração central iluminado -->
  <path d="M300 328
           C300 328 188 250 188 176
           C188 134 222 104 260 104
           C282 104 294 116 300 128
           C306 116 318 104 340 104
           C378 104 412 134 412 176
           C412 250 300 328 300 328 Z"
        fill="url(#crimsonHeart)" opacity="0.22" />

  <path d="M300 306
           C300 306 208 242 208 180
           C208 145 236 120 266 120
           C285 120 295 130 300 140
           C305 130 315 120 334 120
           C364 120 392 145 392 180
           C392 242 300 306 300 306 Z"
        fill="url(#crimsonHeart)" stroke="url(#goldFoil)" stroke-width="2.5" />

  <!-- Silhueta delicada do casal + monograma -->
  <g transform="translate(0, 12)">
    <circle cx="266" cy="212" r="24" fill="#FFFBF5" opacity="0.94" />
    <path d="M224 292 C224 254 252 242 268 242 C284 242 304 254 306 292" fill="#FFFBF5" opacity="0.92" />

    <circle cx="332" cy="220" r="22" fill="#F4D3D9" opacity="0.95" />
    <path d="M294 292 C296 258 315 248 332 248 C349 248 372 258 374 292" fill="#F4D3D9" opacity="0.92" />
  </g>

  <!-- Raminho de rosa em ouro champanhe -->
  <path d="M210 368 Q300 386 390 368" fill="none" stroke="url(#goldFoil)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="300" cy="377" r="4.5" fill="#D7263D" stroke="url(#goldFoil)" stroke-width="1.5" />

  <!-- Textos elegantes -->
  <text x="300" y="438" text-anchor="middle" fill="#FFF6F2" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="44">
    Caique &amp; Isabela
  </text>
  <text x="300" y="482" text-anchor="middle" fill="#E0C48A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" letter-spacing="4" font-weight="600">
    NOSSO CAPÍTULO ESPECIAL
  </text>
  <text x="300" y="525" text-anchor="middle" fill="#E9C9D1" opacity="0.72" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
    (Coloque sua foto favorita em assets/foto-casal.jpg)
  </text>
</svg>
