<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Uma surpresa para Isabela">
  <defs>
    <radialGradient id="nightBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#3A0C1C" />
      <stop offset="48%" stop-color="#1F0711" />
      <stop offset="100%" stop-color="#12040A" />
    </radialGradient>
    <radialGradient id="auroraCrimson" cx="35%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#B5122B" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#B5122B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraGold" cx="68%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#E0C48A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E0C48A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3BD" />
      <stop offset="45%" stop-color="#E0C48A" />
      <stop offset="75%" stop-color="#B8924A" />
      <stop offset="100%" stop-color="#F3E3BD" />
    </linearGradient>
    <linearGradient id="porcelainBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3" />
      <stop offset="65%" stop-color="#F6EEE3" />
      <stop offset="100%" stop-color="#E7DED2" />
    </linearGradient>
    <linearGradient id="satinRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A0A1C" />
      <stop offset="35%" stop-color="#B5122B" />
      <stop offset="52%" stop-color="#FF6B7D" />
      <stop offset="70%" stop-color="#B5122B" />
      <stop offset="100%" stop-color="#7A0A1C" />
    </linearGradient>
    <linearGradient id="satinRedVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7D" />
      <stop offset="30%" stop-color="#D7263D" />
      <stop offset="65%" stop-color="#B5122B" />
      <stop offset="100%" stop-color="#7A0A1C" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo noite vinho com aurora de vela -->
  <rect width="1200" height="630" fill="url(#nightBg)" />
  <circle cx="430" cy="240" r="380" fill="url(#auroraCrimson)" />
  <circle cx="790" cy="360" r="340" fill="url(#auroraGold)" />

  <!-- Moldura dupla de folha de ouro champanhe -->
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="40" y="40" width="1120" height="550" rx="22" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Partículas de poeira dourada -->
  <g fill="#F3E3BD">
    <circle cx="160" cy="140" r="2.5" opacity="0.55" />
    <circle cx="240" cy="460" r="3" opacity="0.4" />
    <circle cx="320" cy="190" r="1.8" opacity="0.65" />
    <circle cx="880" cy="150" r="2.6" opacity="0.5" />
    <circle cx="1010" cy="280" r="2" opacity="0.45" />
    <circle cx="940" cy="480" r="3.2" opacity="0.55" />
    <circle cx="190" cy="320" r="2.2" opacity="0.35" />
  </g>

  <!-- Ilustração da Caixa de Porcelana Branca à Esquerda/Centro -->
  <g transform="translate(270, 325)">
    <!-- Halo quente atrás da caixa -->
    <circle cx="0" cy="-10" r="155" fill="#E0C48A" opacity="0.12" filter="url(#softGlow)" />
    <!-- Sombra de contato -->
    <ellipse cx="0" cy="135" rx="120" ry="22" fill="#070104" opacity="0.72" />

    <!-- Corpo da caixa de porcelana -->
    <rect x="-105" y="-35" width="210" height="150" rx="16" fill="url(#porcelainBody)" stroke="url(#goldFoil)" stroke-width="2" />
    <!-- Sombra lateral sutil na porcelana -->
    <path d="M75 -35 H89 A16 16 0 0 1 105 -19 V99 A16 16 0 0 1 89 115 H75 Z" fill="#E7DED2" opacity="0.55" />

    <!-- Fita vertical de cetim -->
    <rect x="-22" y="-35" width="44" height="150" fill="url(#satinRed)" />
    <!-- Fita horizontal de cetim -->
    <rect x="-105" y="22" width="210" height="38" fill="url(#satinRedVert)" />

    <!-- Tampa de porcelana -->
    <rect x="-116" y="-72" width="232" height="44" rx="12" fill="#FBF8F3" stroke="url(#goldFoil)" stroke-width="2" />
    <!-- Brilho especular na tampa -->
    <rect x="-104" y="-66" width="208" height="6" rx="3" fill="#FFFFFF" opacity="0.85" />
    <!-- Fita na tampa -->
    <rect x="-23" y="-72" width="46" height="44" fill="url(#satinRed)" />

    <!-- Laço de cetim 3D no topo -->
    <path d="M0 -70 C-38 -125, -102 -112, -84 -74 C-72 -58, -32 -64, 0 -70 Z" fill="url(#satinRedVert)" stroke="#F3E3BD" stroke-width="1.2" />
    <path d="M0 -70 C38 -125, 102 -112, 84 -74 C72 -58, 32 -64, 0 -70 Z" fill="url(#satinRedVert)" stroke="#F3E3BD" stroke-width="1.2" />
    <!-- Dobra interna escura do laço -->
    <path d="M-12 -74 C-36 -102, -70 -96, -62 -76 C-52 -68, -26 -70, -12 -74 Z" fill="#7A0A1C" opacity="0.6" />
    <path d="M12 -74 C36 -102, 70 -96, 62 -76 C52 -68, 26 -70, 12 -74 Z" fill="#7A0A1C" opacity="0.6" />
    <!-- Pontas da fita em V -->
    <path d="M-8 -66 L-44 -18 L-28 -22 L-16 -10 L-2 -64 Z" fill="url(#satinRedVert)" />
    <path d="M8 -66 L44 -18 L28 -22 L16 -10 L2 -64 Z" fill="url(#satinRedVert)" />
    <!-- Nó central -->
    <rect x="-18" y="-88" width="36" height="26" rx="9" fill="url(#satinRed)" stroke="url(#goldFoil)" stroke-width="1.5" />

    <!-- Cadeado dourado champanhe -->
    <g transform="translate(0, 42)">
      <path d="M-16 -10 V-24 A16 16 0 0 1 16 -24 V-10" fill="none" stroke="url(#goldFoil)" stroke-width="7" stroke-linecap="round" />
      <rect x="-26" y="-12" width="52" height="44" rx="12" fill="url(#goldFoil)" stroke="#7E6129" stroke-width="2" />
      <!-- Fechadura em coração -->
      <path d="M0 15 C-7 10, -10 3, -6 -1 C-3 -4, 0 -1, 0 2 C0 -1, 3 -4, 6 -1 C10 3, 7 10, 0 15 Z" fill="#2B0B14" />
      <rect x="-2" y="11" width="4" height="9" rx="1.5" fill="#2B0B14" />
    </g>

    <!-- Etiqueta pendurada "Para Isabela" -->
    <g transform="translate(76, -18) rotate(11)">
      <path d="M-55 -48 Q-20 -30 0 0" fill="none" stroke="url(#goldFoil)" stroke-width="1.8" />
      <rect x="-10" y="-6" width="112" height="54" rx="8" fill="#FFFBF5" stroke="url(#goldFoil)" stroke-width="1.5" />
      <circle cx="2" cy="21" r="3.5" fill="#3A0C1C" />
      <text x="50" y="20" text-anchor="middle" fill="#2B0B14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" font-weight="bold">Para Isabela</text>
      <text x="50" y="38" text-anchor="middle" fill="#B5122B" font-size="13" letter-spacing="4">♥ ♥ ♥</text>
    </g>
  </g>

  <!-- Tipografia Editorial à Direita -->
  <g transform="translate(520, 215)">
    <text x="0" y="0" fill="#E0C48A" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="6">UMA SURPRESA PARA</text>
    <text x="0" y="88" fill="#FFF6F2" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="86" font-weight="600">Isabela</text>
    <!-- Sublinhado de fita vermelha e ouro -->
    <path d="M2 110 C120 124, 260 100, 390 112" fill="none" stroke="url(#satinRed)" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="168" fill="#E9C9D1" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="25" font-weight="400">Só a pessoa certa consegue abrir esta caixa…</text>
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="320" height="54" rx="27" fill="url(#satinRed)" stroke="url(#goldFoil)" stroke-width="1.5" />
      <text x="160" y="34" text-anchor="middle" fill="#FFF6F2" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="1">Toque para abrir o presente</text>
    </g>
  </g>
</svg>
