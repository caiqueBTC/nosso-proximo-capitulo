<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#fffdf7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fbe8a6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f5e8da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffcf8"/>
      <stop offset="100%" stop-color="#f4e4d4"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe8a6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a88019"/>
    </linearGradient>
    <!-- White Flower Group -->
    <g id="whiteDaisy">
      <ellipse cx="0" cy="-12" rx="5" ry="11" fill="#ffffff" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="0" cy="12" rx="5" ry="11" fill="#ffffff" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="-12" cy="0" rx="11" ry="5" fill="#ffffff" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="12" cy="0" rx="11" ry="5" fill="#ffffff" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="-8.5" cy="-8.5" rx="9" ry="4.5" transform="rotate(45 -8.5 -8.5)" fill="#fffcf9" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="8.5" cy="8.5" rx="9" ry="4.5" transform="rotate(45 8.5 8.5)" fill="#fffcf9" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="8.5" cy="-8.5" rx="9" ry="4.5" transform="rotate(-45 8.5 -8.5)" fill="#fffcf9" stroke="#e6d7c3" stroke-width="1"/>
      <ellipse cx="-8.5" cy="8.5" rx="9" ry="4.5" transform="rotate(-45 -8.5 8.5)" fill="#fffcf9" stroke="#e6d7c3" stroke-width="1"/>
      <circle cx="0" cy="0" r="6" fill="#f3c64f"/>
    </g>
    <g id="whiteRose">
      <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#dfd2c3" stroke-width="1.2"/>
      <path d="M-10 -5 C-5 -14, 8 -14, 11 -4 C14 6, 4 14, -6 11 C-14 8, -13 -4, -5 -8 C2 -11, 8 -4, 5 3 C2 8, -5 6, -4 0" fill="none" stroke="#d8c6b2" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#fff8e1"/>
    </g>
  </defs>

  <!-- Soft Cream Background -->
  <rect width="500" height="500" rx="28" fill="url(#bgCream)"/>
  <circle cx="250" cy="220" r="210" fill="url(#haloGlow)"/>

  <!-- Golden Arch & Halo -->
  <circle cx="250" cy="175" r="76" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-dasharray="5 5"/>
  <circle cx="250" cy="175" r="68" fill="#fffdf6" fill-opacity="0.7" stroke="url(#goldRing)" stroke-width="2"/>

  <!-- Cute Cartoon Santa Teresinha -->
  <g transform="translate(0, 10)">
    <!-- Veil (Black/Dark Warm Brown Carmelite Veil) -->
    <path d="M172 185 C172 110, 328 110, 328 185 L348 340 C348 355, 152 355, 152 340 Z" fill="#2b1e23" stroke="#1a1114" stroke-width="2.5"/>

    <!-- Habit Tunic (Deep Brown) -->
    <path d="M166 260 C166 230, 334 230, 334 260 L356 420 L144 420 Z" fill="#593a2e" stroke="#3b231b" stroke-width="2.5"/>

    <!-- White Mantle / Cape over shoulders -->
    <path d="M168 255 C190 235, 310 235, 332 255 L346 375 C295 390, 205 390, 154 375 Z" fill="#fcf8f2" stroke="#dfd2c3" stroke-width="2"/>

    <!-- Brown Scapular in center -->
    <rect x="218" y="255" width="64" height="155" rx="8" fill="#593a2e" stroke="#3b231b" stroke-width="2"/>

    <!-- White Wimple (Guimpe) around face and neck -->
    <path d="M192 175 C192 130, 308 130, 308 175 C312 225, 295 268, 250 268 C205 268, 188 225, 192 175 Z" fill="#ffffff" stroke="#dfd2c3" stroke-width="2"/>

    <!-- Cute Cartoon Face -->
    <circle cx="250" cy="182" r="44" fill="#ffe6d4" stroke="#d9b29c" stroke-width="2"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="224" cy="192" rx="8" ry="5" fill="#f4a6b8" opacity="0.65"/>
    <ellipse cx="276" cy="192" rx="8" ry="5" fill="#f4a6b8" opacity="0.65"/>

    <!-- Happy Gentle Eyes -->
    <path d="M224 176 Q231 168 238 176" fill="none" stroke="#3b231b" stroke-width="3" stroke-linecap="round"/>
    <path d="M262 176 Q269 168 276 176" fill="none" stroke="#3b231b" stroke-width="3" stroke-linecap="round"/>

    <!-- Sweet Smile -->
    <path d="M240 197 Q250 206 260 197" fill="none" stroke="#8a3b4b" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Garland of White Roses held in her arms + Special Glowing White Rose offered forward -->
    <!-- Green leaves -->
    <ellipse cx="222" cy="318" rx="18" ry="9" transform="rotate(-25 222 318)" fill="#588157"/>
    <ellipse cx="278" cy="318" rx="18" ry="9" transform="rotate(25 278 318)" fill="#588157"/>
    <path d="M250 295 L250 365" stroke="#3a5a40" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute Hands holding the White Rose forward -->
    <circle cx="236" cy="332" r="12" fill="#ffe6d4" stroke="#d9b29c" stroke-width="2"/>
    <circle cx="264" cy="332" r="12" fill="#ffe6d4" stroke="#d9b29c" stroke-width="2"/>

    <!-- Glowing Halo behind the Main White Rose -->
    <circle cx="250" cy="296" r="36" fill="#fff9db" opacity="0.75"/>
    <!-- Main Big White Rose Offered to Isabela -->
    <g transform="translate(250, 296) scale(1.65)">
      <use href="#whiteRose"/>
    </g>
  </g>

  <!-- Surrounding Garden of Assorted White Flowers -->
  <use href="#whiteDaisy" transform="translate(65, 85) scale(1.1)"/>
  <use href="#whiteRose" transform="translate(115, 55) scale(1.15)"/>
  <use href="#whiteDaisy" transform="translate(390, 62) scale(1.05)"/>
  <use href="#whiteRose" transform="translate(435, 105) scale(1.2)"/>
  <use href="#whiteRose" transform="translate(55, 220) scale(1.1)"/>
  <use href="#whiteDaisy" transform="translate(445, 235) scale(1.1)"/>
  <use href="#whiteRose" transform="translate(68, 370) scale(1.25)"/>
  <use href="#whiteDaisy" transform="translate(125, 430) scale(1.15)"/>
  <use href="#whiteRose" transform="translate(195, 450) scale(1.1)"/>
  <use href="#whiteDaisy" transform="translate(305, 450) scale(1.1)"/>
  <use href="#whiteRose" transform="translate(375, 430) scale(1.2)"/>
  <use href="#whiteDaisy" transform="translate(432, 370) scale(1.1)"/>
</svg>
